<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="src/css/styles.css">

    <title>Studio de Beleza Animal</title>
</head>

<body>
    <div class="navbar">
        <header>
            <!-- O span é um conteiner generico em linha, ele estiliza uma parte de um bloco sem afetar o resto.-->
            <nav>
                <img id="logotype" src="src/images/Logomarca-petshop.png" alt="logomarca">
                
                <button class="btn btn-hamburger">
                    <i class="fa-solid fa-bars"></i>
                </button>
                
                <ul id="nav-links">
                    <li><a href="#contact">Icon de telefone</a></li>
                    <li><a href="#services">Serviços</a></li>
                    <li><a href="account.html">Perfil👤</a></li>
                </ul>
                
                <li>
                    <a href="#" class="btn btn-default"></a>
                </li>
            </nav>
        </header>
    </div>


    <div>
        <main class="corpo">
    <!--Corpo da página-->
            <section>
                <div>
                    <h1>Lorem ipsum dolor</h1>
                    <h3>Seu cachorro ou gato com o melhor atendimento</h3>
                    <button>Saiba Mais</button>
                </div>
                
                <div>
                    <img src="" alt="cachorro com comprimentando com uma patinha">
                </div>
            </section>

    <!--Seção de "clientes satisfeitos"-->
            <section class="carousel-container">
                    <h4>Pessoas que já atendemos:</h4>
                    <!-- Imagens e avaliações-->
                    <img src="https://placehold.co/400x320" alt="Pet 1" class="carousel-image active">
                    <img src="https://placehold.co/200x160" alt="Pet 2" class="carousel-image">
                    <img src="https://placehold.co/200x160" alt="Pet 3" class="carousel-image">
            </section>

    <!-- Seção de serviços oferecidos pelo banho e tosa :)-->
            <section class="services">
                <h2>Nosso serviços:</h2>
                    <div class="service-card-bath">
                        <h1>Banho Simples</h1>
                        <img width="400px" height="290px" src="https://images.unsplash.com/photo-1611173622933-91942d394b04?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Cachorro recebendo um banho">                        
                    </div>
                    <div class="service-card-grooming">
                        <h1>Tosa</h1>
                        <img width="400px" height="290px" src="https://images.unsplash.com/photo-1528846596754-23db743ea0e2?q=80&w=1172&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="cachorro sendo tosado">
                    </div>
                    <div class="service-petshop">
                        <h1>Pet shop (somente presencial)</h1>
                        <img width="400px" src="https://images.unsplash.com/photo-1586046524244-331e228cc8a2?q=80&w=1025&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Compre conosco">
                    </div>
            </section>
        </main>
        <p>Sample text</p>
    </div>
    
    <div class="foot">
        <footer>
            <p>Underdogs Software, all rights reserved</p>
        </footer>
    </div>

    <script src="src/js/script.js"></script>
</body>
</html>
